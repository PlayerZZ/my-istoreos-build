name: Build iStoreOS x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache
          sudo docker image prune -a -f
          sudo apt-get purge -y azure-cli google-cloud-cli microsoft-edge-stable \
            google-chrome-stable firefox dotnet* aspnetcore* || true
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Clone iStoreOS official source
        run: |
          git clone -b istoreos-24.10 --depth 1 https://github.com/istoreos/istoreos.git openwrt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Update feeds (official only)
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (x86_64 default)
        run: |
          cd openwrt
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          EOF
          sed -i 's/^[[:space:]]*//' .config
          make defconfig

      - name: Download & Compile
        run: |
          cd openwrt
          make download -j8
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: istoreos-${{ github.run_number }}
          files: openwrt/bin/targets/x86/64/*combined*.img.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
